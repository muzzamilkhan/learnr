                additionalProperties: false
  /children/{id}/answers:
    get:
      parameters:
        - schema:
            default: maths
            type: string
          in: query
          name: subject
          required: false
        - schema:
            default: 3
            type: integer
            minimum: 1
            maximum: 50
          in: query
          name: perTopic
          required: false
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items: {}
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                additionalProperties: false
        '503':
          description: Default Response
          content:
            application/json:
