  /shares:
    get:
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items: {}
                  viewers:
                    type: array
                    items: {}
                required:
                  - invites
                  - viewers
                additionalProperties: false
        '503':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                additionalProperties: false
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                childIds:
                  minItems: 1
                  type: array
                  items:
                    type: string
              required:
