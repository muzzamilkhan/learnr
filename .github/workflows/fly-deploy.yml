# The API's deploy. The web app is not here: Vercel builds it on push by
# itself, and Fly has no equivalent - `fly deploy` is a CLI push of an image,
# so without this workflow a push moved the web app and left the API behind.
#
# **The tests are a gate rather than a courtesy.** The content packs under
# `src/content/packs/` are generated from the TypeScript literals that author
# them, and the only thing standing between an edited year file and a stale
# shipped pack is `scripts/content-packs.test.ts` comparing the two byte for
# byte. Neither `next build` nor the Docker build runs it, so before this
# workflow that check existed only on whoever's laptop last ran `npm test`.
name: Deploy the API to Fly

on:
  push:
    branches: [master]
    # Prose cannot reach the bundle: the API image carries src/lib, src/content,
    # packages/core and apps/api, and nothing else.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# One deploy at a time. Two rolling updates racing on a single machine is the
# one way this app can be down.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests and typechecks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the version apps/api/Dockerfile builds and runs on
          cache: npm

      # From the root: the workspace links @learnr/core into both applications,
      # and installing inside apps/api cannot see it. `prisma generate` runs on
      # postinstall and falls back to a placeholder URL, so this needs no secret.
      - run: npm ci

      - name: Typecheck the web app
        run: npm run typecheck

      # Includes the drift test - a year file edited without `npm run
      # content:build` reddens here rather than shipping a stale pack.
      - name: Test the web app
        run: npm test

      - name: Typecheck the API
        run: npm run typecheck --workspace apps/api

      # Testcontainers starts a real Postgres, which is the point: three
      # concurrency guards (SELECT ... FOR UPDATE on TopicSkill and on
      # roundsBanked, and the compare-and-set on targetDay) mean nothing
      # against a mock, and they are what a deploy most needs proven.
      - name: Test the API
        run: npm test --workspace apps/api

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # From the repository root, because the Docker build context has to be:
      # packages/core/src is a symlink to ./src, and a context of apps/api
      # alone rebuilds a dangling link. --ha=false keeps it to the one
      # always-on machine; the web app calls this server-side on every render,
      # so a cold start would land in a parent's page load.
      - run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
