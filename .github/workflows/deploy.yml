# The one path to production, and it runs behind the tests.
#
# `vercel.json` sets `git.deploymentEnabled.master: false` - Vercel still
# builds a preview for every push to any other branch (that came back when
# git deploys were re-enabled generally), but `master` is excluded from its
# own git integration entirely. This workflow is the only thing left that can
# move production, so a push to `master` cannot race an ungated Vercel build
# the way it could when `deploymentEnabled` was a plain boolean: there is
# nothing on the other side to race against any more.
#
# **The tests are what stands between a push and production, not a
# courtesy.** `next build` does not run `src/content/catalog.test.ts`, which
# is what proves all 553 shipped templates still validate, still fit
# `MAX_PROMPT_CHARS`, and still never anchor a figure to an answer. Nothing
# else catches a broken template before it ships.
#
# **The schema goes first, so a column exists before the code that reads
# it.** That was the API-goes-first rule's real content when there were two
# artifacts, and it survives down to one: a Fly release used to run
# `db:deploy` as its own release command, ahead of the web app that read
# through the schema it left. Nothing took that over when Fly went - so the
# `deploy` job below runs the migration itself, after the tests and before
# `vercel build`, and a failed migration stops the job before `vercel deploy`
# ever runs.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests and typechecks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `prisma generate` runs on postinstall and falls back to a placeholder
      # URL, so this needs no secret.
      - run: npm ci

      - run: npm run typecheck

      # Includes the `db` project, which starts a real Postgres via
      # Testcontainers - GitHub-hosted Ubuntu runners have Docker already.
      # Three concurrency guards (SELECT ... FOR UPDATE on TopicSkill and on
      # roundsBanked, and the compare-and-set on targetDay) mean nothing
      # against a mock, and they are what a deploy most needs proven, so this
      # is not split down to `test:unit` for speed.
      - run: npm test

  deploy:
    name: Deploy the web app to Vercel
    needs: test
    runs-on: ubuntu-latest
    env:
      # The token is a secret; the two ids are not, but .vercel/project.json
      # is gitignored and they stay out of the tree with it.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # For `db:deploy` below - prisma's CLI and the generated client come
      # from here, not from a global install.
      - run: npm ci

      # Migrates before anything is built or deployed, so a schema change
      # lands before the code reading through it does. `db:deploy` is
      # `node scripts/migrate.mjs`, not a bare `prisma migrate deploy`: Neon
      # accepts a connection while its compute is still waking from
      # autosuspend, and the migration's advisory lock then times out
      # against a fixed 10s Prisma gives no way to raise (P1002) - the
      # script retries that one error three times, five seconds apart, and
      # fails the job on anything else. A failing step stops the job here,
      # before `vercel build` or `vercel deploy` runs.
      - run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Pinned rather than @latest: an unpinned CLI is unreviewed code in the
      # deploy pipeline.
      - run: npm install -g vercel@59.5.0

      # `whoami` first, because the failure this job actually hits is a token
      # that authenticates perfectly well but belongs to a scope that cannot
      # see this project - which the CLI reports as "Could not retrieve
      # Project Settings", reading like a broken link rather than the wrong
      # credential. One line of log naming the account is the difference
      # between knowing that and bisecting it.
      #
      # The pull puts the project's settings and its production environment
      # variables on the runner, which is what makes the build below the same
      # build Vercel's own git integration would have run.
      - run: |
          vercel whoami
          vercel pull --yes --environment=production

      # Built here rather than on Vercel so the artifact that ships is the one
      # the suite above ran beside, and so a red test means nothing was built
      # at all. --prebuilt then uploads the output rather than the source.
      - run: vercel build --prod

      - run: vercel deploy --prebuilt --prod --yes
