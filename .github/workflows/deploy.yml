# A gate, not a deploy. There is one artifact now, and `vercel.json` has
# `git.deploymentEnabled: true` again - Vercel builds and deploys the web app
# itself on every push, the way it did before the API existed. This workflow's
# job is to fail loudly before that happens, not to ship anything itself.
#
# **The tests are a gate rather than a courtesy.** `next build` does not run
# `src/content/catalog.test.ts`, which is what proves all 553 shipped
# templates still validate, still fit `MAX_PROMPT_CHARS`, and still never
# anchor a figure to an answer. Nothing else stands between an edited
# template and a broken one shipping.
name: Checks

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and typechecks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `prisma generate` runs on postinstall and falls back to a placeholder
      # URL, so this needs no secret.
      - run: npm ci

      - run: npm run typecheck

      # Includes the `db` project, which starts a real Postgres via
      # Testcontainers - GitHub-hosted Ubuntu runners have Docker already.
      # Three concurrency guards (SELECT ... FOR UPDATE on TopicSkill and on
      # roundsBanked, and the compare-and-set on targetDay) mean nothing
      # against a mock, and they are what a deploy most needs proven, so this
      # is not split down to `test:unit` for speed.
      - run: npm test
