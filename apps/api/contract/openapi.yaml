openapi: 3.1.0
info:
  title: LearnR API
  version: 0.1.0
components:
  schemas: {}
paths:
  /auth/redeem:
    post:
      operationId: redeemLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 16
              required:
                - code
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  childId:
                    type: string
                  expiresAt:
                    type: string
                required:
                  - token
                  - childId
                  - expiresAt
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                additionalProperties: false
        '429':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                additionalProperties: false
  /me/claim-parent:
    post:
      operationId: claimParentRole
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimed:
                    type: boolean
                required:
                  - claimed
                additionalProperties: false
  /me:
    get:
      operationId: readAccount
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  role:
                    anyOf:
                      - type: string
                        enum:
                          - parent
                          - child
                      - type: 'null'
                  parentId:
                    anyOf:
                      - type: string
                      - type: 'null'
                  name:
                    anyOf:
                      - type: string
                      - type: 'null'
                  avatar:
                    anyOf:
                      - type: string
                        enum:
                          - fox
                          - bear
                          - cat
                          - owl
                          - frog
                          - whale
                          - rabbit
                          - panda
                      - type: 'null'
                  image:
                    anyOf:
                      - type: string
                      - type: 'null'
                  photo:
                    anyOf:
                      - type: string
                      - type: 'null'
                required:
                  - id
                  - role
                  - parentId
                  - name
                  - avatar
                  - image
                  - photo
                additionalProperties: false
        '503':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                additionalProperties: false
  /sessions:
    post:
      operationId: startSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                subject:
                  type: string
                  minLength: 1
                level:
                  type: string
                  enum:
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '5'
                    - '6'
                    - K
                seed:
                  type: string
                  minLength: 1
              required:
                - id
                - subject
                - level
                - seed
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 64
                required:
                  - id
                additionalProperties: false
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 64
                required:
                  - id
                additionalProperties: false
        '503':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                additionalProperties: false
  /sessions/{id}/attempts:
    post:
      operationId: recordAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attempts:
                  minItems: 1
                  maxItems: 200
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      templateId:
                        type: string
                        minLength: 1
                      subject:
                        type: string
                        minLength: 1
                      topic:
                        type: string
                        minLength: 1
                      level:
                        type: string
                        enum:
                          - '1'
                          - '2'
                          - '3'
                          - '4'
                          - '5'
                          - '6'
                          - K
                      prompt:
                        type: string
                      expected:
                        type: string
                      response:
                        type: string
                      correct:
                        type: boolean
                      timeTakenMs:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      answeredAt:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      offsetMinutes:
                        type: integer
                        minimum: -840
                        maximum: 840
                      figure: {}
                    required:
                      - id
                      - templateId
                      - subject
                      - topic
                      - level
                      - prompt
                      - expected
                      - response
                      - correct
                      - timeTakenMs
                      - answeredAt
                      - offsetMinutes
              required:
                - attempts
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  streak:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  streakAdvanced:
                    type: boolean
                required:
                  - streak
                  - streakAdvanced
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                additionalProperties: false
  /sessions/{id}/award-round:
    post:
      operationId: awardRound
      parameters:
