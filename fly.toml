# The API server. The web app deploys separately, on Vercel.
#
# This lives at the repository root rather than beside the API because the
# Docker build context has to be the root: @learnr/core is a workspace package
# whose src is a symlink to this repo's src/, so a context of apps/api alone
# produces a dangling symlink and a build that cannot resolve the engine.
#
# Deploy with `fly deploy` from here.
app = "learnr-api-syd"   # learnr-api was taken globally; Fly app names are unique across all of Fly.io
primary_region = "syd"   # Neon is in ap-southeast-2; every query is a LAN hop.

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  # A deploy carries its own schema changes, which is the property
  # scripts/migrate.mjs used to give the web app. The image keeps the Prisma
  # CLI for this - pruning it would halve the image and break migrations.
  release_command = "npm run db:deploy"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  # The origins the browser may call this API from, as an exact allowlist - the
  # web app writes a child's answers here directly now rather than through a
  # server action, and a browser refuses a wildcard origin once a request
  # carries credentials. Config rather than a secret, so it lives here and
  # deploys with the app.
  LEARNR_WEB_ORIGINS = "https://learnr.muzza.tech"

[http_service]
  internal_port = 3001
  force_https = true
  auto_start_machines = true
  # Never scale to zero. The web app calls this server-side on every page
  # render, so a cold start would land directly in a parent's page load.
  auto_stop_machines = "off"
  # One machine, deliberately. Fly adds a second for high availability unless
  # told otherwise, which doubles the bill for a hobby project that does not
  # need zero-downtime deploys. Deploy with `fly deploy --ha=false` to stop it
  # coming back; a brief blip during a deploy is an acceptable trade here.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512 rather than 256: Prisma's client is not small, and an OOM here is a
  # parent seeing an error page.
  memory = "512mb"
